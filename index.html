<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pitch Trainer">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>🎵 Pitch Trainer</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;min-height:100dvh;background:#0f0e17;color:#fffffe;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:10px 12px;gap:9px;touch-action:manipulation;
    }
    h1{font-size:clamp(1.05rem,3.8vw,1.45rem);font-weight:800;}

    .tabs{display:flex;gap:7px;width:100%;max-width:400px;}
    .tab{
      flex:1;padding:8px 4px;border:2px solid #242440;background:transparent;color:#484868;
      border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s;
    }
    .tab.active{background:#242440;color:#fffffe;border-color:#4444aa;}

    .note-card{
      background:#16213e;border-radius:16px;padding:9px 22px;
      text-align:center;min-width:185px;transition:box-shadow .25s;
    }
    .note-card.lit{box-shadow:0 0 38px rgba(255,215,0,.38);}
    .note-big{font-size:clamp(2rem,9.5vw,3.4rem);font-weight:900;line-height:1;color:#e2b714;min-height:1.1em;}
    .note-sub{font-size:.72rem;color:#5a5a7a;margin-top:2px;min-height:1.1em;}
    .cents-wrap{position:relative;height:5px;background:#1e1e38;border-radius:3px;margin-top:6px;}
    .cents-wrap::after{content:'';position:absolute;left:50%;top:-2px;width:2px;height:9px;background:#2e2e50;transform:translateX(-50%);}
    #centsDot{
      position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
      transform:translate(-50%,-50%);left:50%;background:#555;
      transition:left .08s ease,background .12s ease;
    }

    .staff-wrap{width:100%;max-width:370px;}
    #staffSvg{display:block;margin:0 auto;overflow:visible;}

    /* Metronome canvas */
    #metroView{width:100%;max-width:580px;display:none;}
    #metroCanvas{width:100%;height:340px;display:block;border-radius:14px;background:#06060f;}
    @media(max-height:700px){#metroCanvas{height:260px;}}

    /* Piano */
    .piano-area{width:100%;max-width:580px;}
    .piano{
      position:relative;display:flex;height:135px;
      border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.55);
    }
    @media(max-height:700px){.piano{height:100px;}}

    .wk{
      flex:1;background:#f2ede3;border-right:2px solid rgba(0,0,0,.1);
      border-bottom:5px solid rgba(0,0,0,.1);border-radius:0 0 6px 6px;
      display:flex;align-items:flex-end;justify-content:center;
      padding-bottom:5px;cursor:pointer;user-select:none;
      transition:background .08s,box-shadow .08s;
    }
    .wk:last-child{border-right:none;}
    .wk .lbl{font-size:clamp(.44rem,1.35vw,.62rem);font-weight:700;color:rgba(0,0,0,.28);pointer-events:none;}
    .bk{
      position:absolute;width:calc(100% * 0.62 / 7);height:57%;top:0;background:#1e1e38;
      border-radius:0 0 5px 5px;z-index:2;display:flex;align-items:flex-end;
      justify-content:center;padding-bottom:3px;cursor:pointer;user-select:none;
      box-shadow:0 4px 8px rgba(0,0,0,.65);transition:background .08s,box-shadow .08s;
    }
    .bk .lbl{font-size:clamp(.38rem,1.1vw,.52rem);color:#2e2e50;font-weight:600;pointer-events:none;}
    [data-note="Cs"]{left:calc(100% * 0.69 / 7);}
    [data-note="Ds"]{left:calc(100% * 1.69 / 7);}
    [data-note="Fs"]{left:calc(100% * 3.69 / 7);}
    [data-note="Gs"]{left:calc(100% * 4.69 / 7);}
    [data-note="As"]{left:calc(100% * 5.69 / 7);}

    /* Octave bar */
    #octaveBar{display:none;align-items:center;justify-content:center;gap:12px;padding:6px 0 2px;}
    #octaveBar.show{display:flex;}
    .oct-btn{
      background:#1e1e3a;border:2px solid #3a3a6a;color:#9898c8;
      border-radius:8px;padding:3px 14px;cursor:pointer;font-size:1rem;transition:background .1s;
    }
    .oct-btn:active{background:#2e2e5a;}
    .oct-btn:disabled{opacity:.25;cursor:default;}
    #octLabel{font-size:.8rem;font-weight:700;color:#6868a8;min-width:130px;text-align:center;}

    /* Controls */
    #controls{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .btn{
      padding:11px 32px;font-size:clamp(.85rem,3.2vw,1rem);font-weight:700;
      border:none;border-radius:50px;cursor:pointer;transition:transform .1s;
    }
    .btn:active{transform:scale(.95);}
    .btn-start{background:#e94560;color:#fff;box-shadow:0 4px 18px rgba(233,69,96,.45);}
    .btn-stop{background:#2d2d44;color:#ccc;}
    .hint{font-size:.68rem;color:#3a3a5a;text-align:center;}

    /* Play tab */
    #playView{width:100%;max-width:580px;display:none;flex-direction:column;gap:8px;}
    #scoreScroll{overflow-x:auto;overflow-y:hidden;border-radius:10px;background:#06050f;display:none;border:1px solid #0d0d28;}
    #scoreCanvas{display:block;}
    .play-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
    #playBpmSlider{width:90px;accent-color:#e2b714;}
    #playBpmVal{font-size:.82rem;color:#e2b714;min-width:2.2em;}
    .play-chk{font-size:.75rem;color:#5a5a8a;display:flex;align-items:center;gap:4px;cursor:pointer;}
    #playStatus{font-size:.72rem;color:#3a3a5a;text-align:center;min-height:1.2em;}

    /* Sheet upload drop zone */
    #sheetZone{
      width:100%;border:2px dashed #1e1e38;border-radius:12px;
      padding:18px 12px;text-align:center;cursor:pointer;
      transition:border-color .2s,background .2s;color:#3a3a6a;font-size:.78rem;
      position:relative;
    }
    #sheetZone.drag{border-color:#5555cc;background:rgba(40,40,100,.18);}
    #sheetZone .zone-icon{font-size:1.8rem;display:block;margin-bottom:4px;}
    #sheetZone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    #sheetPreview{width:100%;max-height:140px;object-fit:contain;border-radius:8px;display:none;background:#06050f;}
    #apiKeyWrap{display:flex;align-items:center;gap:6px;font-size:.72rem;color:#3a3a5a;}
    #apiKeyWrap input{
      flex:1;background:#0a0918;color:#aaa;border:1px solid #1a1a38;
      border-radius:6px;padding:4px 8px;font-size:.72rem;outline:none;
      font-family:monospace;
    }
    #apiKeySave{
      background:#1a1a40;border:1.5px solid #3a3aaa;color:#8888dd;
      border-radius:8px;padding:3px 10px;font-size:.7rem;cursor:pointer;white-space:nowrap;
    }
    #apiKeyStatus{font-size:.68rem;}
    .spin{display:inline-block;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* Instrument selector */
    #instBar{display:none;flex-wrap:wrap;gap:5px;justify-content:center;padding:5px 0 2px;}
    #instBar.show{display:flex;}
    .inst-btn{
      background:#0e0d1a;border:1.5px solid #1e1e38;color:#404070;
      border-radius:18px;padding:3px 11px;font-size:.71rem;cursor:pointer;transition:all .12s;white-space:nowrap;
    }
    .inst-btn.sel{background:#1a1a40;border-color:#4848cc;color:#8888ee;}
  </style>
</head>
<body>
  <h1>🎵 Pitch Trainer</h1>

  <div class="tabs">
    <button class="tab active" data-mode="listen">🎤 Listen</button>
    <button class="tab"        data-mode="keys"  >🎹 Keys</button>
    <button class="tab"        data-mode="flow"  >🥁 Beat</button>
    <button class="tab"        data-mode="play"  >▶ Play</button>
  </div>

  <div class="note-card" id="noteCard">
    <div class="note-big" id="noteName">—</div>
    <div class="note-sub" id="noteSub">tap Start then sing!</div>
    <div class="cents-wrap"><div id="centsDot"></div></div>
  </div>

  <div class="staff-wrap" id="staffView">
    <svg id="staffSvg" width="300" height="140" viewBox="0 0 300 140">
      <g stroke="#252540" stroke-width="1.5">
        <line x1="46" y1="95" x2="292" y2="95"/>
        <line x1="46" y1="85" x2="292" y2="85"/>
        <line x1="46" y1="75" x2="292" y2="75"/>
        <line x1="46" y1="65" x2="292" y2="65"/>
        <line x1="46" y1="55" x2="292" y2="55"/>
      </g>
      <text x="2" y="100" font-size="64" fill="#252540"
            font-family="'Times New Roman','FreeSerif',serif">𝄞</text>
      <g id="ledgerG" stroke="#252540" stroke-width="1.5"></g>
      <g id="noteGroup" style="transition:transform .12s ease;" display="none">
        <text id="accidentalEl" x="-20" y="7" font-size="18" fill="#e2b714"
              font-family="'Times New Roman',serif" display="none">♯</text>
        <ellipse cx="0" cy="0" rx="11" ry="8" fill="#e2b714" transform="rotate(-18 0 0)"/>
        <line id="stemEl" x1="10" y1="0" x2="10" y2="-42" stroke="#e2b714" stroke-width="2.5"/>
      </g>
    </svg>
  </div>

  <div id="metroView"><canvas id="metroCanvas"></canvas></div>

  <div id="playView">
    <!-- API key row -->
    <div id="apiKeyWrap">
      <span>🔑 Anthropic API key:</span>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-…  (saved locally, never sent except to Anthropic)">
      <button id="apiKeySave">Save</button>
      <span id="apiKeyStatus"></span>
    </div>
    <!-- Sheet music upload drop zone -->
    <div id="sheetZone">
      <span class="zone-icon">🎼</span>
      Drop a photo of sheet music here, or tap to upload<br>
      <small style="color:#2a2a4a;">(JPG / PNG / GIF — read by Claude Vision)</small>
      <input type="file" id="sheetFile" accept="image/*,audio/midi,.mid,.midi">
    </div>
    <img id="sheetPreview" alt="uploaded sheet">
    <!-- Score canvas -->
    <div id="scoreScroll"><canvas id="scoreCanvas"></canvas></div>
    <!-- Controls: BPM + ▶ Play -->
    <div class="play-row" style="gap:8px;">
      <label class="play-chk" style="color:#5a5a9a;">BPM</label>
      <input type="range" id="playBpmSlider" min="40" max="200" value="100" style="width:80px;">
      <span id="playBpmVal" style="min-width:2em;">100</span>
      <label class="play-chk"><input type="checkbox" id="playSoundOn" checked> 🎹</label>
      <label class="play-chk"><input type="checkbox" id="playMetroOn" checked> 🥁</label>
      <button class="btn btn-start" id="playBtn" style="padding:7px 18px;font-size:.88rem;">▶ Play</button>
    </div>
    <p id="playStatus">Drop a sheet music photo above to play it</p>
  </div>

  <div class="piano-area" id="pianoArea">
    <div id="instBar">
      <button class="inst-btn sel" data-inst="piano">🎹 Piano</button>
      <button class="inst-btn" data-inst="epiano">🎵 E.Piano</button>
      <button class="inst-btn" data-inst="guitar">🎸 Guitar</button>
      <button class="inst-btn" data-inst="bass">🎸 Bass</button>
      <button class="inst-btn" data-inst="strings">🎻 Strings</button>
      <button class="inst-btn" data-inst="drum">🥁 Drum</button>
    </div>
    <div class="piano">
      <div class="wk" data-note="C" ><span class="lbl">C4</span></div>
      <div class="wk" data-note="D" ><span class="lbl">D4</span></div>
      <div class="wk" data-note="E" ><span class="lbl">E4</span></div>
      <div class="wk" data-note="F" ><span class="lbl">F4</span></div>
      <div class="wk" data-note="G" ><span class="lbl">G4</span></div>
      <div class="wk" data-note="A" ><span class="lbl">A4</span></div>
      <div class="wk" data-note="B" ><span class="lbl">B4</span></div>
      <div class="bk" data-note="Cs"><span class="lbl">C#</span></div>
      <div class="bk" data-note="Ds"><span class="lbl">D#</span></div>
      <div class="bk" data-note="Fs"><span class="lbl">F#</span></div>
      <div class="bk" data-note="Gs"><span class="lbl">G#</span></div>
      <div class="bk" data-note="As"><span class="lbl">A#</span></div>
    </div>
    <div id="octaveBar">
      <button class="oct-btn" id="octDown" disabled>◀</button>
      <span id="octLabel">Octave 4  (C4 – B4)</span>
      <button class="oct-btn" id="octUp">▶</button>
    </div>
  </div>

  <div id="controls">
    <button class="btn btn-start" id="startBtn">🎤 Start</button>
    <p class="hint" id="hint">Tap Start, then sing or play any note</p>
  </div>

  <script>
  // ── Constants ─────────────────────────────────────────────────────────
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const NOTE_BARE  = ['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'];
  const DIATONIC   = {C:0,D:1,E:2,F:3,G:4,A:5,B:6};
  const SB=95, LS=10, NOTE_X=185;

  // Beat box / flash colours for each of the 4 beats
  const BEAT_COLS = ['#ff6b6b','#4dabf7','#a9e34b','#cc5de8'];

  // ── DOM ───────────────────────────────────────────────────────────────
  const noteCard     = document.getElementById('noteCard');
  const noteNameEl   = document.getElementById('noteName');
  const noteSubEl    = document.getElementById('noteSub');
  const centsDot     = document.getElementById('centsDot');
  const staffView    = document.getElementById('staffView');
  const metroView    = document.getElementById('metroView');
  const metroCanvas  = document.getElementById('metroCanvas');
  const playView     = document.getElementById('playView');
  const playBtn      = document.getElementById('playBtn');
  const playStatus   = document.getElementById('playStatus');
  const pianoArea    = document.getElementById('pianoArea');
  const noteGroup    = document.getElementById('noteGroup');
  const stemEl       = document.getElementById('stemEl');
  const accidentalEl = document.getElementById('accidentalEl');
  const ledgerG      = document.getElementById('ledgerG');
  const controls     = document.getElementById('controls');
  const startBtn     = document.getElementById('startBtn');
  const hint         = document.getElementById('hint');
  const octaveBar    = document.getElementById('octaveBar');
  const octLabel     = document.getElementById('octLabel');
  const octDown      = document.getElementById('octDown');
  const octUp        = document.getElementById('octUp');

  let currentMode   = 'listen';
  let currentOctave = 4;
  let currentInstrument = 'piano';

  const DRUM_LABELS={C:'Kick',D:'Snare',E:'Hi-hat',F:'Open HH',G:'Tom↑',A:'Tom',B:'Tom↓',
                     Cs:'Clap',Ds:'Rim',Fs:'Crash',Gs:'Ride',As:'Cowbell'};

  function updateKeyLabels(){
    const isDrum=currentInstrument==='drum';
    document.querySelectorAll('.wk').forEach(el=>{
      const b=el.dataset.note;
      el.querySelector('.lbl').textContent=isDrum?(DRUM_LABELS[b]||b):b+currentOctave;
    });
    document.querySelectorAll('.bk').forEach(el=>{
      const b=el.dataset.note;
      el.querySelector('.lbl').textContent=isDrum?(DRUM_LABELS[b]||''):b.replace('s','#');
    });
  }

  // ── Note helpers ──────────────────────────────────────────────────────
  function getFreq(idx, oct){ return 440*Math.pow(2,(idx-9+(oct-4)*12)/12); }
  function buildInfo(idx,octave,cents){
    const name=NOTE_NAMES[idx], letter=name.replace('#',''), isSharp=name.includes('#');
    const adjIdx=((idx+(cents>=0?1:-1))+12)%12;
    const step=(octave-4)*7+(DIATONIC[letter]-2);
    const rl=['','Very Low','Very Low','Low','Middle','High','High'];
    return{name,letter,isSharp,fullName:name+octave,
      bareKey:NOTE_BARE[idx],adjBare:NOTE_BARE[adjIdx],
      octave,cents,step,rangeLabel:rl[Math.min(6,Math.max(1,octave))]||'High',
      mainInt:1-Math.abs(cents)/100,adjInt:Math.abs(cents)/100};
  }
  function freqToInfo(freq){
    const s=12*Math.log2(freq/261.63),r=Math.round(s);
    return buildInfo(((r%12)+12)%12,4+Math.floor(r/12),Math.round((s-r)*100));
  }

  // ── Octave control ────────────────────────────────────────────────────
  function setOctave(o){
    currentOctave=Math.max(1,Math.min(7,o));
    octLabel.textContent=`Octave ${currentOctave}  (C${currentOctave} – B${currentOctave})`;
    if(currentInstrument!=='drum')
      document.querySelectorAll('.wk').forEach(el=>
        el.querySelector('.lbl').textContent=el.dataset.note+currentOctave);
    octDown.disabled=currentOctave<=1; octUp.disabled=currentOctave>=7;
  }
  octDown.addEventListener('click',()=>setOctave(currentOctave-1));
  octUp  .addEventListener('click',()=>setOctave(currentOctave+1));
  setOctave(4);

  // ── Piano glow ────────────────────────────────────────────────────────
  function clearPiano(){
    document.querySelectorAll('.wk,.bk').forEach(el=>{el.style.background='';el.style.boxShadow='';});
  }
  function glowKey(bare,t){
    const el=document.querySelector(`[data-note="${bare}"]`);
    if(!el||t<0.05) return;
    if(el.classList.contains('bk')){
      el.style.background=`rgb(${Math.round(30+t*109)},${Math.round(30+t*62)},${Math.round(56+t*190)})`;
      el.style.boxShadow=`0 0 ${Math.round(t*22)}px rgba(139,92,246,${(t*.85).toFixed(2)}),0 4px 8px rgba(0,0,0,.65)`;
    } else {
      const R=Math.round(242+(255-242)*t),G=Math.round(237+(215-237)*t),B=Math.round(227-227*t);
      el.style.background=`rgb(${R},${G},${B})`;
      el.style.boxShadow=`inset 0 0 0 ${(t*3).toFixed(1)}px rgba(255,215,0,${t.toFixed(2)}),`
                        +`0 0 ${Math.round(t*28)}px rgba(255,200,0,${(t*.5).toFixed(2)})`;
    }
  }

  // ── Staff ─────────────────────────────────────────────────────────────
  function stepToY(s){return SB-s*(LS/2);}
  function updateStaff(info){
    if(!info){noteGroup.setAttribute('display','none');ledgerG.innerHTML='';return;}
    const{step,isSharp}=info;
    noteGroup.style.transform=`translate(${NOTE_X}px,${stepToY(step)}px)`;
    noteGroup.removeAttribute('display');
    const up=step<4,sx=up?10:-10;
    stemEl.setAttribute('x1',sx);stemEl.setAttribute('x2',sx);
    stemEl.setAttribute('y2',up?'-42':'42');
    isSharp?accidentalEl.removeAttribute('display'):accidentalEl.setAttribute('display','none');
    ledgerG.innerHTML='';
    const lx1=NOTE_X-18,lx2=NOTE_X+18;
    if(step<=-2) for(let s=-2;s>=step;s-=2)
      ledgerG.innerHTML+=`<line x1="${lx1}" y1="${stepToY(s)}" x2="${lx2}" y2="${stepToY(s)}"/>`;
    else if(step>=10) for(let s=10;s<=step;s+=2)
      ledgerG.innerHTML+=`<line x1="${lx1}" y1="${stepToY(s)}" x2="${lx2}" y2="${stepToY(s)}"/>`;
  }

  // ── Note card ─────────────────────────────────────────────────────────
  function updateCents(c){
    if(c==null){centsDot.style.background='#555';centsDot.style.left='50%';return;}
    centsDot.style.left=`${Math.max(4,Math.min(96,50+(c/50)*44))}%`;
    centsDot.style.background=Math.abs(c)<10?'#22c55e':Math.abs(c)<25?'#eab308':'#ef4444';
  }
  function updateDisplay(info,freq){
    if(!info){
      noteNameEl.textContent='—';
      noteSubEl.textContent=currentMode==='keys'?'tap a key to hear it!':
                            currentMode==='flow'?'Play music or clap…':'Listening…';
      noteCard.classList.remove('lit');updateCents(null);
    } else {
      noteNameEl.textContent=info.fullName;
      const cs=info.cents!=null?(info.cents>=0?`+${info.cents}¢`:`${info.cents}¢`):'';
      const fq=freq?`${freq.toFixed(1)} Hz`:'';
      noteSubEl.textContent=[fq,cs,info.rangeLabel].filter(Boolean).join(' · ');
      noteCard.classList.add('lit');updateCents(info.cents??null);
    }
  }

  // ── Beat / BPM detection ──────────────────────────────────────────────
  // Ring buffer stores spectral flux values at 25 ms/frame
  const METRO_BUF=160;  // 4 seconds of history
  const eBuf=new Float32Array(METRO_BUF);
  let eHead=0,eFull=false;
  // Previous FFT frame for spectral flux computation
  let prevFreqFrame=null;
  // Inter-onset interval histogram: bins of 10 ms, covering 230–1600 ms (37–260 BPM)
  const HIST_MIN=230,HIST_MAX=1600,HIST_BIN=10;
  const HIST_LEN=Math.ceil((HIST_MAX-HIST_MIN)/HIST_BIN);
  const bpmHist=new Float32Array(HIST_LEN);
  const onsetTimes=[];      // rolling 6-second onset timestamps
  const onsetStrengths=[];  // parallel array: flux/avg ratio at each onset
  let lastBeatTime=0,bgFlashAt=0,beatFlashAt=0;
  let smoothedBPM=null,currentBeat=-1;
  let metroRafId=null;
  let bpmStableCount=0,bpmLocked=false,bpmDriftCount=0;
  let lastHistAt=0;

  // ── Phase-Locked Oscillator (PLO) ────────────────────────────────────
  // Three-phase state machine:
  //   ACQUIRE  — histogram builds up tempo estimate (ploActive=false)
  //   TRACK    — PLO active with small phase/tempo corrections (~2s, ~6 beats)
  //   FREERUN  — clock frozen, runs to end of song, zero corrections
  // Human analogy: listen → think → adjust → stick.
  let ploActive=false;   // PLO is running (TRACK or FREERUN)
  let ploFreerun=false;  // FREERUN: clock is frozen, no more corrections
  let ploPhase=0;        // [0,1) — fractional position within current beat
  let ploPeriod=0;       // ms per beat
  let ploConf=0;         // confidence counter; drop below 0 → unlock (TRACK only)
  const beatHistory=[];  // {time, num} — last 9s of PLO-confirmed beats
  let lastRegCache=null, lastRegCacheAt=0;  // last successful regression result

  // ── Accuracy tracking ────────────────────────────────────────────────
  const phaseErrors=[];  // last 16 confirmed beat phase errors (ms)
  const hitWindow=[];    // last 16 beat outcomes: true=hit, false=miss
  let ploHits=0, ploMisses=0;  // session totals
  let ploBeatCount=0;          // beats fired in the current PLO session (resets on relock)
  let lastMetroFrameAt=0;      // performance.now() of last processMetroFrame call
  // Multi-band flux ring buffers
  const eBufBass=new Float32Array(METRO_BUF);
  const eBufMid =new Float32Array(METRO_BUF);
  let curBassFlux=0, curMidFlux=0;
  let bassRunAvg=1e-9, midRunAvg=1e-9;  // running avgs for band meters
  let lastKickTime=0, lastSnareTime=0;  // separate per-band refractory timers

  // Pendulum state
  const MAX_PEND=0.85;  // wider swing (~49°)
  let pendOriginTime=null, pendBeatPhase=0;

  // Countdown state
  let countdownVal=0, countdownTimer=null;

  function resetMetro(){
    eBuf.fill(0);eHead=0;eFull=false;prevFreqFrame=null;
    bpmHist.fill(0);onsetTimes.length=0;onsetStrengths.length=0;
    lastBeatTime=0;bgFlashAt=0;beatFlashAt=0;
    smoothedBPM=null;currentBeat=-1;
    bpmStableCount=0;bpmLocked=false;bpmDriftCount=0;lastHistAt=0;
    ploActive=false;ploFreerun=false;ploPhase=0;ploPeriod=0;ploConf=0;
    beatHistory.length=0;lastRegCache=null;lastRegCacheAt=0;
    phaseErrors.length=0;hitWindow.length=0;
    ploHits=0;ploMisses=0;ploBeatCount=0;lastMetroFrameAt=0;
    eBufBass.fill(0);eBufMid.fill(0);
    curBassFlux=0;curMidFlux=0;
    lastKickTime=0;lastSnareTime=0;
    pendOriginTime=null;pendBeatPhase=0;
    clockRefTime=null;clockRefBeat=0;
    countdownVal=0;
    if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}
  }

  // Phase optimization at PLO launch: test 20 equidistant phase offsets and pick
  // the one that minimises sum-of-squares distance from recent onsets to predicted beats.
  function findBestPhase(period, now){
    const recent=onsetTimes.filter(t=>t>now-period*4);
    if(recent.length===0) return lastBeatTime>0?((now-lastBeatTime)%period)/period:0;
    let bestPhase=0, bestScore=Infinity;
    for(let k=0;k<20;k++){
      const phase=k/20;
      let score=0;
      for(const t of recent){
        const elapsed=(now-t)%period;
        const frac=((elapsed/period)+phase)%1;
        const err=Math.min(frac,1-frac)*period;
        score+=err*err;
      }
      if(score<bestScore){bestScore=score;bestPhase=phase;}
    }
    return bestPhase;
  }

  // OLS regression over the last 9s of confirmed beat timestamps.
  // Returns {slope (ms/beat), nextBeatTime (ms), r2 (0-1 fit quality)} or null.
  function beatRegression(now){
    if(beatHistory.length<4) return null;
    const recent=beatHistory.filter(b=>b.time>now-9000);
    if(recent.length<4) return null;
    const n=recent.length;
    let sx=0,sy=0,sxx=0,sxy=0;
    for(let i=0;i<n;i++){
      sx+=i; sy+=recent[i].time;
      sxx+=i*i; sxy+=i*recent[i].time;
    }
    const denom=n*sxx-sx*sx;
    if(Math.abs(denom)<1e-9) return null;
    const slope=(n*sxy-sx*sy)/denom;   // ms per beat
    const intercept=(sy-slope*sx)/n;
    if(slope<200||slope>2000) return null;  // sanity: 30-300 BPM
    // R² — quality of fit
    const meanY=sy/n;
    let ssTot=0,ssRes=0;
    for(let i=0;i<n;i++){
      const pred=intercept+slope*i;
      ssTot+=(recent[i].time-meanY)**2;
      ssRes+=(recent[i].time-pred)**2;
    }
    const r2=ssTot>0?1-ssRes/ssTot:0;
    if(r2<0.98) return null;  // reject noisy fits
    const nextBeatTime=intercept+slope*n;
    return {slope, nextBeatTime, r2};
  }

  // PLO step — called every 25 ms frame.
  // State machine: TRACK (active corrections) → FREERUN (frozen clock, never changes).
  function stepPLO(now){
    if(!ploActive||!ploPeriod) return;
    ploPhase+=25/ploPeriod;
    if(ploPhase<1) return;
    ploPhase-=Math.floor(ploPhase);

    // ── Shared beat-fire block ────────────────────────────────────────
    function fireBeat(){
      ploBeatCount++;
      smoothedBPM=60000/ploPeriod;
      bpmLocked=true;
      clockRefBeat=clockRefTime!==null?(clockRefBeat+1)%4:0;
      clockRefTime=now; beatFlashAt=now; bgFlashAt=now;
      beatHistory.push({time:now,num:clockRefBeat});
      while(beatHistory.length&&beatHistory[0].time<now-9000) beatHistory.shift();
      pendBeatPhase=(pendBeatPhase+Math.PI)%(Math.PI*2);
      pendOriginTime=now;
      noteNameEl.textContent=Math.round(smoothedBPM);
      noteCard.classList.add('lit'); updateCents(null);
      if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;countdownVal=0;}
    }

    // ── FREERUN: clock is anchored — zero corrections, runs to end ───
    // Listen → Think → Adjust → STICK. No more chasing onsets.
    if(ploFreerun){
      // Still measure accuracy against real onsets for the HUD (display only).
      const win=ploPeriod*0.13;
      let bestOnset=null,bestDist=win;
      for(let i=onsetTimes.length-1;i>=0;i--){
        const d=Math.abs(onsetTimes[i]-now);
        if(d<bestDist){bestDist=d;bestOnset=onsetTimes[i];}
        if(onsetTimes[i]<now-win) break;
      }
      hitWindow.push(bestOnset!==null);
      if(hitWindow.length>16) hitWindow.shift();
      if(bestOnset!==null){
        phaseErrors.push(bestDist); if(phaseErrors.length>16) phaseErrors.shift();
        ploHits++;
      } else { ploMisses++; }
      fireBeat();
      noteSubEl.textContent='BPM ⚓';  // anchor = frozen
      return;
    }

    // ── TRACK: active correction phase (~6 beats, ~2–3 seconds) ──────
    const win=ploPeriod*Math.max(0.13,0.28-(ploConf/16)*0.15);
    let bestOnset=null,bestDist=win;
    for(let i=onsetTimes.length-1;i>=0;i--){
      const d=Math.abs(onsetTimes[i]-now);
      if(d<bestDist){bestDist=d;bestOnset=onsetTimes[i];}
      if(onsetTimes[i]<now-win) break;
    }

    hitWindow.push(bestOnset!==null);
    if(hitWindow.length>16) hitWindow.shift();
    const hitRate=hitWindow.length>0?hitWindow.filter(Boolean).length/hitWindow.length:0.5;
    const meanErr=phaseErrors.length>0?phaseErrors.reduce((a,b)=>a+b)/phaseErrors.length:30;

    const phaseGain=hitRate>0.82&&meanErr<18?0.10:hitRate<0.50?0.26:0.18;
    const tempoGain=hitRate>0.82&&meanErr<18?0.005:hitRate<0.50?0.020:0.012;

    if(bestOnset!==null){
      phaseErrors.push(bestDist);
      if(phaseErrors.length>16) phaseErrors.shift();
      ploHits++;
      const err=(bestOnset-now)/ploPeriod;
      ploPhase+=err*phaseGain;
      ploPeriod+=err*ploPeriod*tempoGain;
      ploPeriod=Math.max(273,Math.min(1500,ploPeriod));
      ploConf=Math.min(16,ploConf+1);
    } else {
      ploMisses++;
      if(--ploConf<(hitRate>0.75?-5:-3)){
        ploActive=false;ploFreerun=false;bpmLocked=false;
        bpmStableCount=0;bpmDriftCount=0;bpmHist.fill(0);
        ploBeatCount=0;beatHistory.length=0;
        phaseErrors.length=0;hitWindow.length=0;
        return;
      }
    }

    fireBeat();
    noteSubEl.textContent='BPM  🔒';

    // ── Transition TRACK → FREERUN ────────────────────────────────────
    // 10 beats in this session + ≥80% hit rate → freeze. Gives ~5s at 120BPM
    // for phase/tempo corrections before the grid is locked forever.
    if(ploBeatCount>=10&&hitRate>=0.80){
      ploFreerun=true;
    }
  }

  // Clock-driven beat counter — 1-2-3-4 advances at exact clock intervals
  let clockRefTime=null, clockRefBeat=0;

  // Three-band spectral flux: bass (kick), mid (snare/guitar), high-mid (hi-hat).
  // Returns {bass, mid, high, combined} — combined is weighted for waveform display.
  function computeMultiBandFlux(freqBuf){
    if(!prevFreqFrame){
      prevFreqFrame=freqBuf.slice(0);
      return {bass:0,mid:0,high:0,combined:0};
    }
    let bass=0,mid=0,high=0;
    // Bass: ~70-327 Hz (kick drum, bass guitar fundamentals)
    for(let b=3;b<=14;b++){
      const d=Math.pow(10,freqBuf[b]/10)-Math.pow(10,prevFreqFrame[b]/10);
      if(d>0) bass+=d;
    }
    // Mid: ~350-1290 Hz (snare body, guitar, vocal attack)
    for(let b=15;b<=55;b++){
      const d=Math.pow(10,freqBuf[b]/10)-Math.pow(10,prevFreqFrame[b]/10);
      if(d>0) mid+=d;
    }
    // High-mid: ~1300-3050 Hz (hi-hat edge, snare crack, cymbal shimmer)
    for(let b=56;b<=130;b++){
      const d=Math.pow(10,freqBuf[b]/10)-Math.pow(10,prevFreqFrame[b]/10);
      if(d>0) high+=d;
    }
    prevFreqFrame.set(freqBuf);  // update all bins (was only updating bass bins)
    // Bass-dominant weighting: kick carries beat timing
    const combined=bass*0.60+mid*0.32+high*0.08;
    return {bass,mid,high,combined};
  }

  // Beat histogram BPM: accumulate all inter-onset intervals.
  // Each onset pair votes for a tempo. Decay old votes.
  // Far more noise-resistant than autocorrelation on raw energy.
  function updateBpmHist(now){
    // Decay histogram (half-life ~4 seconds = each 500 ms update × 0.917)
    for(let i=0;i<HIST_LEN;i++) bpmHist[i]*=0.917;
    // Vote: every recent onset pair, weighted by onset strength
    const cutoff=now-6000;
    while(onsetTimes.length&&onsetTimes[0]<cutoff){
      onsetTimes.shift(); onsetStrengths.shift();
    }
    // All-pairs voting: every combination of two onsets casts a vote.
    // Pairs further apart in the onset list get distance-weighted down (1/(j-i))
    // so adjacent pairs still dominate, but harmonic overtones get reinforced.
    for(let i=0;i<onsetTimes.length;i++){
      for(let j=i+1;j<onsetTimes.length;j++){
        const iv=onsetTimes[j]-onsetTimes[i];
        if(iv<HIST_MIN||iv>HIST_MAX) continue;
        const distW=1/(j-i);  // weight decays with distance between pair
        const w=Math.max(0.3,Math.min(3.0,Math.sqrt(onsetStrengths[i]*onsetStrengths[j])))*distW;
        const bin=Math.floor((iv-HIST_MIN)/HIST_BIN);
        if(bin>=0&&bin<HIST_LEN) bpmHist[bin]+=w;
        for(let m=2;m<=3;m++){
          const miv=iv/m;
          if(miv>=HIST_MIN&&miv<HIST_MAX){
            const mb=Math.floor((miv-HIST_MIN)/HIST_BIN);
            if(mb>=0&&mb<HIST_LEN) bpmHist[mb]+=w*0.6/m;
          }
        }
      }
    }
    // Find peak bin (with parabolic interpolation for sub-bin precision)
    let bestBin=0,bestVal=0;
    for(let i=1;i<HIST_LEN-1;i++) if(bpmHist[i]>bestVal){bestVal=bpmHist[i];bestBin=i;}
    if(bestVal<0.5) return null;  // not enough data yet
    // Parabolic interpolation
    const l=bpmHist[bestBin-1]||0,c=bpmHist[bestBin],r=bpmHist[bestBin+1]||0;
    const offset=(l<r)?0.5*(r-l)/(2*c-l-r):0;
    const peakMs=HIST_MIN+(bestBin+offset)*HIST_BIN;
    return 60000/peakMs;
  }

  function processMetroFrame(freqBuf){
    lastMetroFrameAt=performance.now();
    const {bass,mid,combined}=computeMultiBandFlux(freqBuf);
    const flux=combined;
    curBassFlux=bass; curMidFlux=mid;
    const idx=eHead%METRO_BUF;
    eBuf[idx]=flux; eBufBass[idx]=bass; eBufMid[idx]=mid;
    eHead++;
    if(eHead>=METRO_BUF) eFull=true;

    // Running averages + stddev for adaptive per-band thresholds
    let avg=0,bassAvg=0,midAvg=0;
    const len=eFull?METRO_BUF:eHead;
    for(let i=0;i<len;i++){avg+=eBuf[i];bassAvg+=eBufBass[i];midAvg+=eBufMid[i];}
    avg/=len; bassAvg/=len; midAvg/=len;
    bassRunAvg=bassAvg; midRunAvg=midAvg;
    let bassVar=0,midVar=0;
    for(let i=0;i<len;i++){
      bassVar+=(eBufBass[i]-bassAvg)**2;
      midVar+=(eBufMid[i]-midAvg)**2;
    }
    const bassStd=Math.sqrt(bassVar/len);
    const midStd=Math.sqrt(midVar/len);
    // mean+1.5σ threshold — adapts to signal dynamics; floor at 1.25/1.30× mean
    const bassThr=Math.max(bassAvg*1.25,bassAvg+1.5*bassStd);
    const midThr =Math.max(midAvg*1.30, midAvg+1.6*midStd);

    const now=performance.now();

    // ── Onset detection ─────────────────────────────────────────────────
    const minSince=smoothedBPM?Math.max(230,60000/smoothedBPM*0.60):230;
    // 4-frame lookback (100 ms): current frame must exceed all previous 4 frames
    const p1b=eBufBass[(eHead-2+METRO_BUF)%METRO_BUF];
    const p2b=eBufBass[(eHead-3+METRO_BUF)%METRO_BUF];
    const p3b=eBufBass[(eHead-4+METRO_BUF)%METRO_BUF];
    const p4b=eBufBass[(eHead-5+METRO_BUF)%METRO_BUF];
    const p1m=eBufMid[(eHead-2+METRO_BUF)%METRO_BUF];
    const p2m=eBufMid[(eHead-3+METRO_BUF)%METRO_BUF];
    const p3m=eBufMid[(eHead-4+METRO_BUF)%METRO_BUF];
    const p4m=eBufMid[(eHead-5+METRO_BUF)%METRO_BUF];
    // Kick: bass peak beats last 100ms AND crosses adaptive threshold
    const kickOnset=bass>bassThr&&bass>p1b&&bass>p2b&&bass>p3b&&bass>p4b&&bass>1e-9;
    // Snare/clap: mid peak beats last 100ms, minimal bass presence
    const snareOnset=mid>midThr&&mid>p1m&&mid>p2m&&mid>p3m&&mid>p4m&&bass>bassAvg*0.35&&mid>1e-9;
    // Separate refractory timers per band — kick at 0ms doesn't block snare at 50ms
    const kickFire=kickOnset&&(now-lastKickTime)>minSince;
    const snareFire=snareOnset&&(now-lastSnareTime)>minSince;
    if(kickFire||snareFire){
      if(kickFire) lastKickTime=now;
      if(snareFire) lastSnareTime=now;
      lastBeatTime=now;
      const strength=Math.min(3.0,flux/(avg+1e-12));
      onsetTimes.push(now);
      onsetStrengths.push(strength);

      // Pre-PLO: sync pendulum/clock directly from detected onsets
      if(!ploActive){
        let doSync=true;
        if(smoothedBPM && clockRefTime!==null){
          const beatMs=60000/smoothedBPM;
          const elapsed=now-clockRefTime;
          const nearestBeat=Math.round(elapsed/beatMs)*beatMs;
          doSync=Math.abs(elapsed-nearestBeat)<beatMs*0.30;
        }
        if(doSync){
          pendBeatPhase=(pendBeatPhase+Math.PI)%(Math.PI*2);
          pendOriginTime=now;
          if(smoothedBPM && clockRefTime!==null){
            const beatMs=60000/smoothedBPM;
            clockRefBeat=(clockRefBeat+Math.round((now-clockRefTime)/beatMs))%4;
          } else { clockRefBeat=0; }
          clockRefTime=now; bgFlashAt=now; beatFlashAt=now;
        }
      }
      // When PLO is active, onset is available to stepPLO via onsetTimes[] —
      // PLO decides whether to use it (within prediction window) or discard it.
    }

    // ── BPM histogram — acquisition phase only ──────────────────────────
    // Runs to find initial BPM; once PLO launches, histogram only watches
    // for large sustained tempo changes (real song tempo change, not noise).
    if(onsetTimes.length>=3 && now-lastHistAt>500){
      lastHistAt=now;
      const rawBpm=updateBpmHist(now);
      if(rawBpm && rawBpm>=40 && rawBpm<=220){
        // Tempo-octave resolution: prefer candidate closest to reference on log scale
        let abpm=rawBpm;
        if(smoothedBPM){
          const ref=smoothedBPM;
          const cands=[rawBpm,rawBpm/2,rawBpm*2].filter(b=>b>=40&&b<=220);
          abpm=cands.reduce((best,c)=>
            Math.abs(Math.log2(c)-Math.log2(ref))<Math.abs(Math.log2(best)-Math.log2(ref))?c:best
          ,rawBpm);
        }

        if(ploActive){
          // PLO running: only watch for sustained large drift (real tempo change)
          const pct=Math.abs(abpm-smoothedBPM)/smoothedBPM;
          if(pct>0.12) bpmDriftCount++; else bpmDriftCount=Math.max(0,bpmDriftCount-1);
          if(bpmDriftCount>=6&&!ploFreerun){
            // Confirmed tempo change — tear down PLO, let histogram re-acquire
            ploActive=false; bpmLocked=false;
            bpmStableCount=0; bpmDriftCount=0; bpmHist.fill(0);
            smoothedBPM=abpm;
            noteNameEl.textContent=Math.round(smoothedBPM);
            noteSubEl.textContent='BPM  ♩';
          }
        } else {
          // Acquisition: build smoothedBPM from histogram
          if(!smoothedBPM){
            smoothedBPM=abpm; bpmStableCount=0; bpmDriftCount=0;
          } else {
            const pct=Math.abs(abpm-smoothedBPM)/smoothedBPM;
            smoothedBPM=smoothedBPM*0.60+abpm*0.40;
            if(pct<0.03) bpmStableCount++; else bpmStableCount=Math.max(0,bpmStableCount-2);
            if(bpmStableCount>=10){
              // BPM stable → launch PLO
              ploPeriod=60000/smoothedBPM;
              // Find the phase offset that best aligns with recent onsets
              ploPhase=findBestPhase(ploPeriod, now);
              // Fresh session: clear all per-session state so stale data from a
              // previous failed lock doesn't corrupt the new TRACK phase.
              ploBeatCount=0;beatHistory.length=0;
              phaseErrors.length=0;hitWindow.length=0;ploFreerun=false;
              ploConf=8; ploActive=true; bpmLocked=true; bpmDriftCount=0;
            }
          }
          noteNameEl.textContent=Math.round(smoothedBPM);
          noteSubEl.textContent='BPM  ♩';
          noteCard.classList.add('lit'); updateCents(null);
          if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;countdownVal=0;}
        }
      }
    }

    // ── Advance PLO every frame ──────────────────────────────────────────
    stepPLO(now);
  }

  // ── Pendulum angle (synced to beats) ─────────────────────────────────
  function getPendAngle(t){
    if(pendOriginTime===null) return 0;
    // Use PLO period when active for tightest sync; fall back to smoothedBPM
    const beatMs=ploActive?ploPeriod:(smoothedBPM?60000/smoothedBPM:800);
    const elapsed=t-pendOriginTime;
    // cos(0)=1 → MAX_PEND at pendOriginTime (= beat moment), swings to −MAX_PEND at next beat
    return MAX_PEND*Math.cos(Math.PI*elapsed/beatMs+pendBeatPhase);
  }

  // ── Canvas helpers ────────────────────────────────────────────────────
  function roundRect(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }
  function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

  function initMetroCanvas(){
    const dpr=window.devicePixelRatio||1;
    const rect=metroCanvas.getBoundingClientRect();
    metroCanvas.width =(rect.width  ||metroView.clientWidth ||340)*dpr;
    metroCanvas.height=(rect.height ||340)*dpr;
  }

  function drawMetronome(){
    const dpr=window.devicePixelRatio||1;
    let W=metroCanvas.width/dpr, H=metroCanvas.height/dpr;
    if(!W||!H||W<50||H<50){ initMetroCanvas(); W=metroCanvas.width/dpr; H=metroCanvas.height/dpr; }
    if(!W||!H) return;
    const ctx=metroCanvas.getContext('2d');
    const now=performance.now();

    // Layout
    const BPM_Y    = H*0.17;
    const BOXES_MID= H*0.46;
    const WAVE_TOP = H*0.65;

    // ── Clock-driven beat counter (stable 1-2-3-4) ──
    // Use ploPeriod directly when PLO is active for exact clock alignment.
    if(clockRefTime!==null && (ploActive ? ploPeriod>0 : smoothedBPM)){
      const beatMs=ploActive&&ploPeriod>0 ? ploPeriod : 60000/smoothedBPM;
      const elapsed=now-clockRefTime;
      const adv=Math.floor(elapsed/beatMs);
      const newBeat=(clockRefBeat+adv)%4;
      if(newBeat!==currentBeat){
        currentBeat=newBeat;
        beatFlashAt=now; bgFlashAt=now;
      }
    }

    // Flash states
    const sinceFlash=now-beatFlashAt;
    const sinceBg=now-bgFlashAt;
    const flashFrac=currentBeat>=0?Math.max(0,1-sinceFlash/300):0;
    const bgFrac=Math.max(0,1-sinceBg/220);

    ctx.save(); ctx.scale(dpr,dpr);

    // ── Background ──
    ctx.fillStyle='#06060f'; ctx.fillRect(0,0,W,H);
    if(bgFrac>0){
      const[br,bg,bb]=hexRgb(BEAT_COLS[Math.max(0,currentBeat)]);
      ctx.fillStyle=`rgba(${br},${bg},${bb},${(bgFrac*.10).toFixed(3)})`;
      ctx.fillRect(0,0,W,H);
    }

    // ── BPM / countdown display ──────────────────────────────────────
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(smoothedBPM){
      // Large BPM number with beat-flash glow
      const glow=Math.max(0,1-(now-beatFlashAt)/280);
      const col=BEAT_COLS[Math.max(0,currentBeat)];
      ctx.font=`900 ${Math.round(H*.20)}px sans-serif`;
      if(glow>.05){ctx.shadowColor=col;ctx.shadowBlur=32*glow;}
      ctx.fillStyle=glow>.05?col:'#e2b714';
      ctx.fillText(Math.round(smoothedBPM), W/2, BPM_Y);
      ctx.shadowBlur=0;
      ctx.font=`600 ${Math.round(H*.055)}px sans-serif`;
      ctx.fillStyle=bpmLocked?'#7878cc':'#5a5a7a';
      ctx.fillText(bpmLocked?'BPM 🔒':'BPM', W/2, BPM_Y+Math.round(H*.13));
    } else if(isRunning){
      if(countdownVal>0){
        const ringR=Math.min(H*.09,36);
        const cx=W/2, cy=BPM_Y+ringR*.2;
        ctx.beginPath(); ctx.arc(cx,cy,ringR,0,Math.PI*2);
        ctx.strokeStyle='rgba(40,40,80,0.9)'; ctx.lineWidth=6; ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx,cy,ringR,-Math.PI/2,-Math.PI/2+Math.PI*2*(countdownVal/8));
        ctx.strokeStyle='rgba(226,183,20,0.9)'; ctx.lineWidth=6;
        ctx.lineCap='round'; ctx.stroke();
        ctx.font=`900 ${Math.round(ringR*1.2)}px sans-serif`;
        ctx.fillStyle='rgba(226,183,20,0.95)';
        ctx.fillText(String(countdownVal),cx,cy);
        ctx.font=`${Math.round(H*.044)}px sans-serif`;
        ctx.fillStyle='#3a3a6a';
        ctx.fillText('Listening for beat…',W/2,cy+ringR+H*.05);
      } else {
        ctx.font=`${Math.round(H*.046)}px sans-serif`;
        ctx.fillStyle='rgba(160,100,60,0.85)';
        ctx.fillText('Move closer & keep the beat 🎵',W/2,BPM_Y);
      }
    } else {
      ctx.font=`${Math.round(H*.046)}px sans-serif`;
      ctx.fillStyle='#2a2a48';
      ctx.fillText('Tap Start → play music or clap 🎵',W/2,BPM_Y);
    }

    // ── Beat boxes 1 2 3 4 ──
    const boxW=Math.min(W*.165,66), boxH=Math.min(H*.175,65);
    const gap=(W-boxW*4)/5;
    for(let i=0;i<4;i++){
      const bx2=gap+i*(boxW+gap);
      const isAct=i===currentBeat, frac=isAct?flashFrac:0;
      const[r2,g2,b2]=hexRgb(BEAT_COLS[i]);
      // Box fill
      ctx.fillStyle=frac>.05
        ?`rgba(${r2},${g2},${b2},${(0.15+frac*.82).toFixed(2)})`
        :`rgba(${r2},${g2},${b2},0.08)`;
      roundRect(ctx,bx2,BOXES_MID-boxH/2,boxW,boxH,12); ctx.fill();
      // Border
      ctx.strokeStyle=`rgba(${r2},${g2},${b2},${frac>.1?0.8:0.2})`;
      ctx.lineWidth=2;
      roundRect(ctx,bx2,BOXES_MID-boxH/2,boxW,boxH,12); ctx.stroke();
      // Glow
      if(frac>.08){
        ctx.shadowColor=BEAT_COLS[i]; ctx.shadowBlur=18*frac;
        roundRect(ctx,bx2,BOXES_MID-boxH/2,boxW,boxH,12); ctx.fill(); ctx.shadowBlur=0;
      }
      // Number
      ctx.font=`900 ${Math.round(boxH*.56)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=frac>.15?`rgba(255,255,255,${(.7+frac*.28).toFixed(2)})`:
                             `rgba(${r2},${g2},${b2},0.45)`;
      ctx.fillText(String(i+1),bx2+boxW/2,BOXES_MID);
    }

    // ── Accuracy / confidence display (between boxes and waveform) ──────
    if(ploActive && hitWindow.length>=4){
      const hitRate=hitWindow.filter(Boolean).length/hitWindow.length;
      const meanErr=phaseErrors.length>0?phaseErrors.reduce((a,b)=>a+b)/phaseErrors.length:0;
      const barY=WAVE_TOP-H*0.085;
      // Confidence bar background + fill
      ctx.fillStyle='rgba(25,25,55,0.7)';
      ctx.fillRect(0,barY,W,5);
      const confCol=hitRate>0.80?'#22c55e':hitRate>0.55?'#e2b714':'#ef4444';
      ctx.fillStyle=confCol;
      ctx.fillRect(0,barY,W*hitRate,5);
      // Stats text (right-aligned)
      ctx.font=`${Math.round(H*0.036)}px sans-serif`;
      ctx.textAlign='right'; ctx.textBaseline='bottom';
      ctx.fillStyle='rgba(140,140,200,0.70)';
      ctx.fillText(`${Math.round(hitRate*100)}% · ±${Math.round(meanErr)}ms`,W-6,barY-3);
      // Band activity meters (left side) — B=bass, M=mid
      const mH=H*0.042,mW=Math.round(W*0.055);
      const bassLv=Math.min(1,curBassFlux/(bassRunAvg*3+1e-12));
      const midLv =Math.min(1,curMidFlux /(midRunAvg*3 +1e-12));
      [[bassLv,'rgba(100,140,255,0.55)','B'],[midLv,'rgba(60,200,170,0.55)','M']].forEach(([lv,col,lbl],ki)=>{
        const mx=6+ki*(mW+5), myTop=barY-mH-2;
        ctx.fillStyle='rgba(25,25,55,0.6)';
        ctx.fillRect(mx,myTop,mW,mH);
        ctx.fillStyle=col;
        ctx.fillRect(mx,myTop+mH*(1-lv),mW,mH*lv);
        ctx.font=`${Math.round(H*0.026)}px sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillStyle='rgba(100,100,160,0.7)';
        ctx.fillText(lbl,mx+mW/2,myTop-1);
      });
    }

    // ── Beat waveform ─────────────────────────────────────────────────
    // Layout: past zone (left 60%) | NOW line | future zone (right 40%)
    const wH=H*0.27, wBottom=WAVE_TOP+wH;
    const nowX=W*0.60;           // "NOW" line x position (near centre)
    const futureW=W-nowX;        // future zone width
    const histMs=4000;           // history shown (ms)
    const futureMs=2000;         // future zone spans 2 seconds ahead
    const bwid=nowX/METRO_BUF;  // bar width scaled to past zone

    // Normalize bars
    let wMax=0;
    for(let i=0;i<METRO_BUF;i++) if(eBuf[i]>wMax) wMax=eBuf[i];
    if(wMax<1e-14) wMax=1e-14;

    // ── Past zone: flux bars coloured by beat ──
    for(let i=0;i<METRO_BUF;i++){
      const barTime=now-(METRO_BUF-1-i)*25;
      const idx=(eHead-METRO_BUF+i+METRO_BUF*2)%METRO_BUF;
      const e=eBuf[idx]||0;
      const bh=Math.max(1.5,(e/wMax)*wH*0.92);
      const age=(METRO_BUF-1-i)/METRO_BUF;
      const al=(0.10+(1-age)*0.62).toFixed(2);
      const x=i*bwid;
      let beatNum=-1;
      for(const {time,num} of beatHistory){
        if(Math.abs(time-barTime)<50){beatNum=num;break;}
      }
      if(beatNum>=0){
        const[cr,cg,cb]=hexRgb(BEAT_COLS[beatNum]);
        ctx.fillStyle=`rgba(${cr},${cg},${cb},${al})`;
      } else {
        ctx.fillStyle=`rgba(50,50,170,${al})`;
      }
      ctx.fillRect(x,wBottom-bh,Math.max(1,bwid-1),bh);
    }

    // Baseline
    ctx.strokeStyle='rgba(35,35,70,0.8)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,wBottom); ctx.lineTo(W,wBottom); ctx.stroke();

    // ── PLO phase progress bar (thin strip above waveform) ──
    // Shows how far through the current beat period the PLO is.
    // Reaches nowX exactly as the next beat fires.
    if(ploActive && ploPeriod>0){
      const phaseX=ploPhase*nowX;
      ctx.fillStyle='rgba(40,40,100,0.35)';
      ctx.fillRect(0,WAVE_TOP-5,nowX,4);
      ctx.fillStyle='rgba(100,100,255,0.55)';
      ctx.fillRect(0,WAVE_TOP-5,phaseX,4);
      // Cursor dot
      ctx.beginPath(); ctx.arc(phaseX,WAVE_TOP-3,3.5,0,Math.PI*2);
      ctx.fillStyle='rgba(160,160,255,0.85)'; ctx.fill();
    }

    // ── Past beat markers: solid coloured lines + labels ──
    ctx.setLineDash([3,3]);
    beatHistory.forEach(({time,num})=>{
      const age=now-time;
      if(age>histMs) return;
      const xPos=(1-age/histMs)*nowX;
      const alpha=Math.max(0,1-age/3500);
      const col=BEAT_COLS[num%4];
      const[cr,cg,cb]=hexRgb(col);
      ctx.strokeStyle=`rgba(${cr},${cg},${cb},${(alpha*0.7).toFixed(2)})`;
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(xPos,WAVE_TOP-5); ctx.lineTo(xPos,wBottom); ctx.stroke();
      if(alpha>0.25){
        ctx.setLineDash([]);
        ctx.font=`700 ${Math.round(H*0.042)}px sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillStyle=`rgba(${cr},${cg},${cb},${alpha.toFixed(2)})`;
        ctx.fillText(String(num+1),xPos,WAVE_TOP-7);
        ctx.setLineDash([3,3]);
      }
    });
    ctx.setLineDash([]);

    // ── NOW line ──
    ctx.strokeStyle='rgba(226,183,20,0.75)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(nowX,WAVE_TOP-9); ctx.lineTo(nowX,wBottom+2); ctx.stroke();
    ctx.font=`700 ${Math.round(H*0.038)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillStyle='rgba(226,183,20,0.75)';
    ctx.fillText('NOW',nowX,WAVE_TOP-10);

    // ── Future zone: regression-projected beats (ghost markers) ──
    // Update regression cache — keep the last good result for up to 2.5s so
    // brief PLO unlock gaps don't blank the future zone.
    const reg=beatRegression(now);
    if(reg){lastRegCache=reg;lastRegCacheAt=now;}
    const useReg=reg||(lastRegCache&&now-lastRegCacheAt<2500?lastRegCache:null);
    const showFuture=(ploActive&&ploPeriod>0)||useReg;

    if(showFuture){
      // Light background tint for future zone
      ctx.fillStyle='rgba(20,20,50,0.35)';
      ctx.fillRect(nowX,WAVE_TOP-9,futureW,wH+11);

      // PLO phase is source-of-truth when active. Interpolate it forward by
      // (now - lastMetroFrameAt) to remove the 0-25ms staleness from the 25ms
      // processing cadence. This keeps projected markers smooth at 60fps.
      const ploLive=ploActive&&ploPeriod>0;
      const refPeriod=ploLive?ploPeriod:(useReg?useReg.slope:800);
      let msToNext;
      if(ploLive){
        const drift=lastMetroFrameAt>0?Math.min(now-lastMetroFrameAt,40):0;
        const interp=ploPhase+drift/ploPeriod;
        msToNext=ploPeriod*(1-(interp%1));
      } else {
        msToNext=useReg?(useReg.nextBeatTime-now):800;
      }
      while(msToNext<-refPeriod*0.05) msToNext+=refPeriod;

      // Trust indicator: green = live regression, blue = PLO or cached
      const confCol=reg
        ?`rgba(80,220,120,${(0.15+0.35*reg.r2).toFixed(2)})`
        :'rgba(100,100,255,0.15)';
      ctx.fillStyle=confCol;
      ctx.fillRect(nowX,WAVE_TOP-9,3,wH+11);

      for(let i=0;i<4;i++){
        const msAhead=msToNext+i*refPeriod;
        if(msAhead<0) continue;
        if(msAhead>futureMs) break;
        const xFut=nowX+(msAhead/futureMs)*futureW;
        const projNum=(currentBeat+1+i)%4;
        const col=BEAT_COLS[projNum];
        const[cr,cg,cb]=hexRgb(col);
        const alpha=0.55*(1-msAhead/futureMs);
        // Ghost dashed line
        ctx.strokeStyle=`rgba(${cr},${cg},${cb},${alpha.toFixed(2)})`;
        ctx.lineWidth=1.5; ctx.setLineDash([2,5]);
        ctx.beginPath(); ctx.moveTo(xFut,WAVE_TOP-5); ctx.lineTo(xFut,wBottom); ctx.stroke();
        ctx.setLineDash([]);
        // Ghost label
        ctx.font=`600 ${Math.round(H*0.04)}px sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillStyle=`rgba(${cr},${cg},${cb},${Math.min(1,alpha*2).toFixed(2)})`;
        ctx.fillText(String(projNum+1),xFut,WAVE_TOP-7);
      }
    }

    ctx.restore();
  }

  let metroWatchdog=null;
  function startMetroLoop(){
    // Always force-restart to clear any dead RAF
    if(metroRafId){cancelAnimationFrame(metroRafId);metroRafId=null;}
    if(metroWatchdog){clearInterval(metroWatchdog);metroWatchdog=null;}
    (function tick(){
      if(currentMode!=='flow'){metroRafId=null;return;}
      try{ drawMetronome(); }catch(e){ console.error('metro:',e); }
      metroRafId=requestAnimationFrame(tick);
    })();
    // Watchdog: if RAF died, restart every 2s
    metroWatchdog=setInterval(()=>{
      if(currentMode!=='flow'){clearInterval(metroWatchdog);metroWatchdog=null;return;}
      if(!metroRafId) startMetroLoop();
    },2000);
  }
  function stopMetroLoop(){
    if(metroRafId){cancelAnimationFrame(metroRafId);metroRafId=null;}
    if(metroWatchdog){clearInterval(metroWatchdog);metroWatchdog=null;}
  }

  // ── Piano sound ───────────────────────────────────────────────────────
  let kbCtx=null, kbTimeout=null;

  // ── Instrument synthesis ──────────────────────────────────────────────
  function playPiano(ac,freq,t){
    const master=ac.createGain(), filt=ac.createBiquadFilter();
    filt.type='lowpass'; filt.Q.value=0.6;
    filt.frequency.setValueAtTime(Math.min(freq*20,20000),t);
    filt.frequency.exponentialRampToValueAtTime(Math.min(freq*6,12000),t+0.05);
    filt.frequency.exponentialRampToValueAtTime(Math.min(freq*3,6000),t+0.5);
    master.connect(filt); filt.connect(ac.destination);
    [[1,0.52,2.5],[2,0.28,1.1],[3,0.14,0.55],[4.01,0.08,0.3],[5.09,0.04,0.18],[7.2,0.02,0.1]]
    .forEach(([m,v,d])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine'; o.frequency.value=freq*m;
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+d+0.05);
    });
    const nhz=Math.round(ac.sampleRate*0.014);
    const nb=ac.createBuffer(1,nhz,ac.sampleRate);
    const nd=nb.getChannelData(0); for(let i=0;i<nhz;i++) nd[i]=Math.random()*2-1;
    const ns=ac.createBufferSource(),ng=ac.createGain();
    ns.buffer=nb; ng.gain.setValueAtTime(0.14,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.014);
    ns.connect(ng); ng.connect(filt); ns.start(t);
    master.gain.setValueAtTime(0.001,t);
    master.gain.linearRampToValueAtTime(0.48,t+0.005);
    master.gain.exponentialRampToValueAtTime(0.22,t+0.08);
    master.gain.exponentialRampToValueAtTime(0.0001,t+2.5);
  }

  function playEPiano(ac,freq,t){
    const master=ac.createGain(); master.gain.value=0.5; master.connect(ac.destination);
    const mod=ac.createOscillator(), modG=ac.createGain(), car=ac.createOscillator();
    mod.frequency.value=freq*14;
    modG.gain.setValueAtTime(freq*4,t); modG.gain.exponentialRampToValueAtTime(freq*0.15,t+1.0);
    mod.connect(modG); modG.connect(car.frequency);
    car.frequency.value=freq; car.type='sine';
    const g=ac.createGain();
    g.gain.setValueAtTime(0.75,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.2);
    g.gain.exponentialRampToValueAtTime(0.0001,t+3.0);
    car.connect(g); g.connect(master);
    const lfo=ac.createOscillator(),lfoG=ac.createGain();
    lfo.frequency.value=5.2; lfoG.gain.value=0.06;
    lfo.connect(lfoG); lfoG.connect(master.gain);
    mod.start(t); car.start(t); lfo.start(t);
    mod.stop(t+3.1); car.stop(t+3.1); lfo.stop(t+3.1);
  }

  function playGuitar(ac,freq,t){
    const sr=ac.sampleRate, dur=2.6;
    const N=Math.round(sr*dur), period=Math.round(sr/freq);
    const data=new Float32Array(N);
    for(let i=0;i<period+1;i++) data[i]=Math.random()*2-1;
    for(let i=period+1;i<N;i++) data[i]=(data[i-period]+data[i-period+1])*0.499;
    const buf=ac.createBuffer(1,N,sr); buf.getChannelData(0).set(data);
    const src=ac.createBufferSource(), master=ac.createGain();
    src.buffer=buf;
    master.gain.setValueAtTime(0.8,t); master.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(master); master.connect(ac.destination); src.start(t); src.stop(t+dur+0.05);
  }

  function playBass(ac,freq,t){
    const sr=ac.sampleRate, dur=2.2;
    const N=Math.round(sr*dur), period=Math.round(sr/freq);
    const data=new Float32Array(N);
    for(let i=0;i<period+1;i++) data[i]=Math.random()*2-1;
    for(let i=period+1;i<N;i++) data[i]=(data[i-period]+data[i-period+1])*0.4995;
    const buf=ac.createBuffer(1,N,sr); buf.getChannelData(0).set(data);
    const src=ac.createBufferSource();
    const filt=ac.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=freq*3; filt.Q.value=1.2;
    const master=ac.createGain();
    src.buffer=buf;
    master.gain.setValueAtTime(1.0,t); master.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(filt); filt.connect(master); master.connect(ac.destination); src.start(t); src.stop(t+dur+0.05);
  }

  function playStrings(ac,freq,t){
    const master=ac.createGain(); master.gain.value=0.3;
    const filt=ac.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=freq*6; filt.Q.value=0.9;
    master.connect(filt); filt.connect(ac.destination);
    [[1,0.5],[2,0.3],[3,0.15],[4,0.08],[5,0.04]].forEach(([mult,amp],i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sawtooth'; o.frequency.value=freq*mult;
      o.detune.value=(i%2===0?1:-1)*(i*4+3);
      g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(amp,t+0.28);
      g.gain.exponentialRampToValueAtTime(0.0001,t+2.8);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+2.9);
    });
  }

  // ── Drum kit ──────────────────────────────────────────────────────────
  function _noise(ac,dur){
    const b=ac.createBuffer(1,Math.round(ac.sampleRate*dur),ac.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b;
  }
  function playKick(ac,t){
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(48,t+0.15);
    g.gain.setValueAtTime(1.0,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.5);
    const ns=ac.createBufferSource(),ng=ac.createGain();
    ns.buffer=_noise(ac,0.008); ng.gain.setValueAtTime(0.5,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.008);
    ns.connect(ng); ng.connect(ac.destination); ns.start(t);
  }
  function playSnare(ac,t){
    const o=ac.createOscillator(),og=ac.createGain(); o.frequency.value=195;
    og.gain.setValueAtTime(0.55,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t+0.15);
    const ns=ac.createBufferSource(),nf=ac.createBiquadFilter(),ng=ac.createGain();
    nf.type='bandpass'; nf.frequency.value=3000; nf.Q.value=0.6;
    ns.buffer=_noise(ac,0.18); ng.gain.setValueAtTime(0.9,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    ns.connect(nf); nf.connect(ng); ng.connect(ac.destination); ns.start(t);
  }
  function playHiHat(ac,t,open){
    const dur=open?0.5:0.07;
    const ns=ac.createBufferSource(),nf=ac.createBiquadFilter(),ng=ac.createGain();
    nf.type='highpass'; nf.frequency.value=8000;
    ns.buffer=_noise(ac,dur); ng.gain.setValueAtTime(0.55,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    ns.connect(nf); nf.connect(ng); ng.connect(ac.destination); ns.start(t);
  }
  function playTom(ac,t,freq){
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.setValueAtTime(freq*1.6,t); o.frequency.exponentialRampToValueAtTime(freq,t+0.08);
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.45);
  }
  function playClap(ac,t){
    [0,0.012,0.024].forEach(d=>{
      const ns=ac.createBufferSource(),nf=ac.createBiquadFilter(),ng=ac.createGain();
      nf.type='bandpass'; nf.frequency.value=1400; nf.Q.value=0.9;
      ns.buffer=_noise(ac,0.045); ng.gain.setValueAtTime(0.85,t+d); ng.gain.exponentialRampToValueAtTime(0.0001,t+d+0.045);
      ns.connect(nf); nf.connect(ng); ng.connect(ac.destination); ns.start(t+d);
    });
  }
  function playCrash(ac,t){
    const ns=ac.createBufferSource(),nf=ac.createBiquadFilter(),ng=ac.createGain();
    nf.type='highpass'; nf.frequency.value=5500;
    ns.buffer=_noise(ac,1.8); ng.gain.setValueAtTime(0.65,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+1.8);
    ns.connect(nf); nf.connect(ng); ng.connect(ac.destination); ns.start(t);
  }
  function playRide(ac,t){
    [2000,3100].forEach(f=>{
      const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.3);
    });
  }
  function playCowbell(ac,t){
    [800,540].forEach(f=>{
      const o=ac.createOscillator(),g=ac.createGain(); o.type='square'; o.frequency.value=f;
      g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.8);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.85);
    });
  }
  function playRim(ac,t){
    const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=1600;
    g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.06);
    const ns=ac.createBufferSource(),nf=ac.createBiquadFilter(),ng=ac.createGain();
    nf.type='highpass'; nf.frequency.value=5000;
    ns.buffer=_noise(ac,0.04); ng.gain.setValueAtTime(0.45,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
    ns.connect(nf); nf.connect(ng); ng.connect(ac.destination); ns.start(t);
  }
  function playDrum(ac,bare,t){
    ({C:playKick,D:playSnare,Fs:playCrash,Gs:playRide,As:playCowbell,Cs:playClap,Ds:playRim}[bare]||
     ((ac,t)=>{
       if(bare==='E') playHiHat(ac,t,false);
       else if(bare==='F') playHiHat(ac,t,true);
       else if(bare==='G') playTom(ac,t,290);
       else if(bare==='A') playTom(ac,t,200);
       else if(bare==='B') playTom(ac,t,130);
     }))(ac,t);
  }

  function playKeyNote(bare,freq,dispOct){
    const showOct=dispOct!==undefined?dispOct:currentOctave;
    clearTimeout(kbTimeout);
    clearPiano(); glowKey(bare,1.0);
    const ac=kbCtx, t=ac.currentTime;

    if(currentInstrument==='drum'){
      const dname=DRUM_LABELS[bare]||bare;

        noteCard.classList.remove('lit'); updateCents(null);

      return;
    }

    noteNameEl.textContent=bare.replace('s','#')+showOct;

  // ── Pitch detection ───────────────────────────────────────────────────
  function detectPitch(buf,sr){
    const n=buf.length; let rms=0;
    for(let i=0;i<n;i++) rms+=buf[i]*buf[i];
    if(Math.sqrt(rms/n)<0.004) return null;
    const minL=Math.floor(sr/2000),maxL=Math.min(Math.ceil(sr/60),n-1);
    const ac=new Float32Array(maxL+1);
    for(let lag=minL;lag<=maxL;lag++){
      let s=0; for(let i=0;i<n-lag;i++) s+=buf[i]*buf[i+lag]; ac[lag]=s;
    }
    let d=minL; while(d<maxL&&ac[d]>ac[d+1]) d++;
    let best=d; for(let i=d+1;i<=maxL;i++) if(ac[i]>ac[best]) best=i;
    if(ac[best]<=0) return null;
    let lag=best;
    if(best>minL&&best<maxL){
      const a=ac[best-1],b=ac[best],c=ac[best+1],dn=2*(a-2*b+c);
      if(dn!==0) lag=best-(a-c)/dn;
    }
    return sr/lag;
  }

  // ── Main audio loop ───────────────────────────────────────────────────
  let audioCtx,analyser,mediaStream;
  let rafId,isRunning=false,smoothedFreq=null,silentCount=0,lastProcTime=0;
  let pendingKey=null,pendingCount=0,confirmedKey=null;
  const SILENCE_HOLD=3,CONFIRM=1;

  function debounceKey(raw){
    if(!raw){pendingKey=confirmedKey=null;pendingCount=0;return null;}
    if(raw===confirmedKey){pendingKey=null;pendingCount=0;return raw;}
    if(raw===pendingKey){if(++pendingCount>=CONFIRM){confirmedKey=raw;return raw;}return confirmedKey;}
    pendingKey=raw;pendingCount=1;return confirmedKey;
  }

  function loop(ts){
    if(!isRunning) return;
    rafId=requestAnimationFrame(loop);

    if(currentMode==='flow'){
      if(ts-lastProcTime<25) return;
      lastProcTime=ts;
      const freqBuf=new Float32Array(analyser.frequencyBinCount);
      analyser.getFloatFrequencyData(freqBuf);
      processMetroFrame(freqBuf);
      return;
    }

    if(ts-lastProcTime<30) return;
    lastProcTime=ts;
    const buf=new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    const raw=detectPitch(buf,audioCtx.sampleRate);

    if(raw){
      silentCount=0;
      if(!smoothedFreq) smoothedFreq=raw;
      else {
        const ratio=raw/smoothedFreq;
        const adj=ratio>1.7?raw/2:ratio<0.6?raw*2:raw;
        smoothedFreq=Math.exp(0.55*Math.log(smoothedFreq)+0.45*Math.log(adj));
      }
      const info=freqToInfo(smoothedFreq);
      const key=debounceKey(info.bareKey);
      if(key){
        if(info.octave!==currentOctave) setOctave(info.octave);
        clearPiano();
        glowKey(info.bareKey,info.mainInt);
        glowKey(info.adjBare,info.adjInt*0.65);
        updateDisplay(info,smoothedFreq);
        updateStaff(info);
      }
    } else {
      if(++silentCount>SILENCE_HOLD){
        smoothedFreq=null;debounceKey(null);
        clearPiano();updateDisplay(null);updateStaff(null);
      }
    }
  }

  async function start(){
    try{
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      mediaStream=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false,
      });
      const src=audioCtx.createMediaStreamSource(mediaStream);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=2048; analyser.smoothingTimeConstant=0;
      src.connect(analyser);
      smoothedFreq=null;silentCount=0;lastProcTime=0;
      pendingKey=null;pendingCount=0;confirmedKey=null;

      if(currentMode==='flow'){
        resetMetro();
        initMetroCanvas();   // ensure canvas sized correctly
        startMetroLoop();    // restart if loop died
        countdownVal=8;
        countdownTimer=setInterval(()=>{
          if(!isRunning||currentMode!=='flow'||smoothedBPM){
            clearInterval(countdownTimer);countdownTimer=null;return;
          }
          countdownVal=Math.max(0,countdownVal-1);
        },1000);

      hint.textContent=currentMode==='flow'

  }

  // ── MacBook keyboard shortcuts — G = C4 (middle), ASDFGHJKL;' white, QWERTY black ──

  const KEY_MAP={
    a:{bare:'F',oct:3}, s:{bare:'G',oct:3}, d:{bare:'A',oct:3},
    f:{bare:'B',oct:3}, g:{bare:'C',oct:4}, h:{bare:'D',oct:4},

  // ── Play tab — score renderer ─────────────────────────────────────────
  let isPlaying=false, playCtx2=null, playTimers=[];
  let scoreNotePos=[], scoreClean=null;

  const scoreScroll = document.getElementById('scoreScroll');
  const scoreCanvas = document.getElementById('scoreCanvas');

  // Score layout constants
  const SC_H=172, SC_SB=128, SC_LS=11, SC_MARGIN=52, SC_BEAT=78;

  function noteStep(n){
    if(n.rest) return null;
    return (n.oct-4)*7+(DIATONIC[n.bare.charAt(0)]-2);
  }

  function renderScore(notes){
    scoreNotePos=[];
    if(!notes.length){scoreScroll.style.display='none';scoreClean=null;return;}
    const totalBeats=notes.reduce((s,n)=>s+n.beats,0);
    const W=SC_MARGIN+Math.ceil(totalBeats)*SC_BEAT+50;
    scoreCanvas.width=W; scoreCanvas.height=SC_H;
    const ctx=scoreCanvas.getContext('2d');

    ctx.fillStyle='#06050f'; ctx.fillRect(0,0,W,SC_H);

    // Staff lines
    ctx.strokeStyle='#252540'; ctx.lineWidth=1.5;
    for(let l=0;l<5;l++){
      const y=SC_SB-l*SC_LS;
      ctx.beginPath(); ctx.moveTo(SC_MARGIN-6,y); ctx.lineTo(W-8,y); ctx.stroke();
    }

    // Treble clef
    ctx.fillStyle='#2e2e58'; ctx.font='68px Times New Roman,serif';
    ctx.textBaseline='alphabetic'; ctx.fillText('𝄞',-2,SC_SB+20);

    let cum=0;
    notes.forEach((n,i)=>{
      // Barline every 4 beats
      if(cum>0 && Math.round(cum*100)%400===0){
        const bx=SC_MARGIN+cum*SC_BEAT-5;
        ctx.strokeStyle='#1a1a32'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(bx,SC_SB-4*SC_LS); ctx.lineTo(bx,SC_SB); ctx.stroke();
      }
      const x=SC_MARGIN+cum*SC_BEAT+SC_BEAT*0.25;
      cum+=n.beats;

      if(n.rest){
        ctx.fillStyle='#252548'; ctx.fillRect(x-9,SC_SB-3*SC_LS-4,18,8);
        scoreNotePos.push({x,y:SC_SB-3*SC_LS,rest:true});
        return;
      }
      const step=noteStep(n);
      const y=SC_SB-step*(SC_LS/2);

      // Ledger lines
      ctx.strokeStyle='#252540'; ctx.lineWidth=1.5;
      if(step<=-2) for(let s=-2;s>=step;s-=2){
        const ly=SC_SB-s*(SC_LS/2);
        ctx.beginPath(); ctx.moveTo(x-12,ly); ctx.lineTo(x+12,ly); ctx.stroke();
      }
      if(step>=10) for(let s=10;s<=step;s+=2){
        const ly=SC_SB-s*(SC_LS/2);
        ctx.beginPath(); ctx.moveTo(x-12,ly); ctx.lineTo(x+12,ly); ctx.stroke();
      }

      // Accidental
      if(n.bare.endsWith('s')){
        ctx.fillStyle='#2e2e58'; ctx.font='12px Times New Roman,serif';
        ctx.textBaseline='middle'; ctx.fillText('♯',x-20,y);
      }

      // Notehead
      ctx.fillStyle='#404070';
      ctx.beginPath(); ctx.ellipse(x,y,8,6,-0.28,0,Math.PI*2); ctx.fill();

      // Stem
      const up=step<5;
      ctx.strokeStyle='#404070'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(up?x+7:x-7,y); ctx.lineTo(up?x+7:x-7,up?y-28:y+28); ctx.stroke();

      // Dot for dotted rhythm
      if(n.beats*2%2===1){
        ctx.fillStyle='#404070';
        ctx.beginPath(); ctx.arc(x+13,y-2,2.5,0,Math.PI*2); ctx.fill();
      }

      scoreNotePos.push({x,y,step,sharp:n.bare.endsWith('s')});
    });

    // Save clean copy for re-highlighting
    scoreClean=document.createElement('canvas');
    scoreClean.width=W; scoreClean.height=SC_H;
    scoreClean.getContext('2d').drawImage(scoreCanvas,0,0);
    scoreScroll.style.display='block';
    scoreScroll.scrollLeft=0;
  }

  function hlScore(idx){
    if(!scoreClean) return;
    const ctx=scoreCanvas.getContext('2d');
    ctx.drawImage(scoreClean,0,0);
    if(idx<0||!scoreNotePos[idx]) return;
    const{x,y,rest,step,sharp}=scoreNotePos[idx];

    if(!rest){
      // Glow ring
      ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2);
      ctx.fillStyle='rgba(226,183,20,0.13)'; ctx.fill();

      // Gold notehead
      ctx.shadowColor='#e2b714'; ctx.shadowBlur=14;
      ctx.fillStyle='#e2b714';
      ctx.beginPath(); ctx.ellipse(x,y,8,6,-0.28,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;

      // Gold stem
      const up=step<5;
      ctx.strokeStyle='#e2b714'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(up?x+7:x-7,y); ctx.lineTo(up?x+7:x-7,up?y-28:y+28); ctx.stroke();

      // Gold accidental
      if(sharp){ctx.fillStyle='#e2b714';ctx.font='12px Times New Roman,serif';ctx.textBaseline='middle';ctx.fillText('♯',x-20,y);}
    }

    // Playhead line
    ctx.strokeStyle='rgba(226,183,20,0.3)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,SC_SB-5*SC_LS); ctx.lineTo(x,SC_SB+SC_LS+4); ctx.stroke();

    // Scroll so active note is at ~30% from left
    scoreScroll.scrollLeft=Math.max(0,x-scoreScroll.clientWidth*0.3);
  }

  // Last set of parsed notes loaded from a sheet photo — used by ▶ Play to replay.
  let lastParsedNotes=null;

  // ── API key management ───────────────────────────────────────────────
  let claudeApiKey=localStorage.getItem('pitchy_api_key')||'';
  const apiKeyInput=document.getElementById('apiKeyInput');
  const apiKeyStatus=document.getElementById('apiKeyStatus');
  if(claudeApiKey){ apiKeyInput.value=claudeApiKey; apiKeyStatus.textContent='✓ saved'; apiKeyStatus.style.color='#22c55e'; }
  document.getElementById('apiKeySave').addEventListener('click',()=>{
    const k=apiKeyInput.value.trim();
    if(!k){ apiKeyStatus.textContent='enter key'; apiKeyStatus.style.color='#ef4444'; return; }
    claudeApiKey=k;
    localStorage.setItem('pitchy_api_key',k);
    apiKeyStatus.textContent='✓ saved'; apiKeyStatus.style.color='#22c55e';
  });

  async function analyzeSheetImage(base64,mime){
    if(!claudeApiKey) throw new Error('No API key — enter it above first');
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':claudeApiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body:JSON.stringify({
        model:'claude-opus-4-7',
        max_tokens:2048,
        temperature:0,
        messages:[
          {role:'user',content:[
            {type:'image',source:{type:'base64',media_type:mime,data:base64}},
            {type:'text',text:
`You are an expert music transcriptionist. Read ONLY the melody noteheads from the treble clef staff.

══ IGNORE COMPLETELY (these are NOT notes) ══
• Chord symbols written above the staff — letters like F, G, C, Bb, Am, G/F, Bbm/Db etc.
• Lyrics written below the staff
• Any text, numbers, or symbols that are not noteheads sitting on staff lines or spaces

══ TREBLE CLEF POSITIONS ══
Lines bottom→top:  E4  G4  B4  D5  F5   (Every Good Boy Does Fine)
Spaces bottom→top: F4  A4  C5  E5       (FACE)
One ledger below:  D4 then C4 (middle C = one ledger line below E4)
One ledger above:  G5  A5  B5

══ STEP-BY-STEP ══
1. KEY SIGNATURE — count flats/sharps immediately after the clef symbol at the start of the staff.
   • 0 = C major (no accidentals)
   • 1 flat (Bb) = F major — every B becomes Bb throughout, unless cancelled by a natural ♮
   • 2 flats (Bb,Eb) = Bb major — every B and E become flat throughout
   • 1 sharp (F#) = G major — every F becomes F# throughout
   • A natural sign ♮ in a bar cancels the key signature for that note in that bar only.
2. TIME SIGNATURE — top number = beats per bar.
3. Read LEFT TO RIGHT, TOP SYSTEM TO BOTTOM SYSTEM, bar by bar.
   For each notehead: find its line/space → apply key signature → read duration.

DURATIONS (quarter = 1 beat):
  whole=4  half=2  dotted-half=3  quarter=1  dotted-quarter=1.5  eighth=0.5  dotted-eighth=0.75  sixteenth=0.25

══ OUTPUT FORMAT ══
Output ONE LINE of space-separated tokens — nothing else, no explanations, no bar numbers.
• Note: Letter + accidental + octave + colon + beats  →  F4:1  Bb4:0.5  E4:2  C#5:1.5
• Rest: R:beats  →  R:1
• Tied notes: merge into one token (add beats)
• Chord / multiple voices: output ONLY the highest (melody) notehead`
            }
          ]},
        ]
      })
    });
    if(!resp.ok){
      const txt=await resp.text();
      throw new Error(`API error ${resp.status}: ${txt.slice(0,200)}`);
    }
    const json=await resp.json();
    const raw=json.content[0].text.trim();
    console.log('[Pitch Trainer] Claude raw response:', raw);

    // Primary: strict "C4:1" / "Bb4:0.5" / "R:1" tokens
    let clean=raw.split(/\s+/)
      .filter(tok=>/^[A-Gr][#b]?[0-9]?(?::[0-9.]+)?$/i.test(tok))
      .join(' ');

    // Fallback: Claude sometimes outputs "C4" without duration — extract note names,
    // assign quarter-note duration so at least the pitches are correct.
    if(!clean){
      const found=raw.match(/\b([A-Ga-g][#b]?[2-8])\b/g)||[];
      clean=found.map(n=>n+':1').join(' ');
      if(clean) console.log('[Pitch Trainer] Used fallback note extraction (no durations)');
    }

    if(!clean) throw new Error(`No notes in response (${raw.length} chars). Open DevTools → Console to see Claude's output.`);
    return clean;
  }

  // earlyCtx: AudioContext created synchronously during the user-gesture (file pick / drop)
